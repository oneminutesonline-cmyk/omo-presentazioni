<div class="kpi"><div class="num">${D.convenzioni.length}</div><span>convenzioni in essere</span></div><div class="kpi"><div class="num">${D.eventi.length}</div><span>fiere ed eventi in calendario</span></div></div>`}
function vFederazione(){const p=D.pratiche.filter(x=>x.stato!=="Socio attivo").length;const inv=Object.keys(state.inviate).length;
 return `<div class="top"><div><h1>FINCO <span style="color:var(--y)">Hub</span></h1><p class="sub">Livello Federazione: la federazione ordinata, in una schermata.</p></div><div class="pill">Dati pubblici letti il ${D.lettoIl}</div></div>${kpis()}
 <div class="grid g3" style="margin-top:14px">
 <div class="card"><h3>Da fare oggi</h3><ul class="list"><li><span>Pratiche di adesione da portare in Giunta</span><b>${p}</b></li><li><span>Opportunità inviate alle associazioni</span><b>${inv} / ${D.convenzioni.length+D.eventi.length}</b></li><li><span>Adesioni fiere in scadenza</span><b>1</b></li></ul><p class="note">SENCON Dakar: adesioni entro il 15/11/2026 (newsletter 10/2026).</p></div>
 <div class="card"><h3>Come arrivano le opportunità oggi</h3><p>Newsletter PDF mensile, email della Segreteria, pagina convenzioni con codice da chiedere. Nessuna misura di chi legge.</p><p class="note">Con il Hub: ogni opportunità ha destinatari, letture e attivazioni per associazione.</p></div>
 <div class="card"><h3>Il viaggio di un'opportunità</h3><div class="flow"><div class="on">Segreteria FINCO</div><div class="on">38 associazioni</div><div>Imprese</div><div>Attivazioni</div></div><p class="note">Oggi il viaggio si ferma alla seconda casella. Il Hub lo porta fino alla quarta.</p></div></div>
 <h2>Associazioni per tipo di impresa</h2><div class="grid g3">${["A","B","C"].map(t=>{const l=D.associazioni.filter(a=>a.tipo===t);return `<div class="card"><h3>${tipoNome[t]} <span style="color:var(--y)">${l.length}</span></h3><p>${l.map(a=>a.sigla).join(" · ")}</p></div>`}).join("")}</div>`}
function vAnagrafica(){const q=state.q.toLowerCase();const l=D.associazioni.filter(a=>(!state.filtroTipo||a.tipo===state.filtroTipo)&&(!state.filtroFil||a.filiera===state.filtroFil)&&(!q||(a.sigla+a.nome+a.settore+a.presidente+a.citta).toLowerCase().includes(q)));
 return `<div class="top"><div><h1>Anagrafica soci</h1><p class="sub">${D.associazioni.length} associazioni federate e ${D.aggregati.length} soci aggregati. Oggi è un PDF: qui è viva, cercabile, aggiornabile dal socio.</p></div></div>
 <div class="tools"><input id="q" placeholder="Cerca sigla, settore, presidente, città" value="${state.q}"><select id="ft"><option value="">Tutti i tipi</option>${Object.entries(tipoNome).map(([k,v])=>`<option value="${k}" ${state.filtroTipo===k?"selected":""}>${v}</option>`).join("")}</select>
 <select id="ff"><option value="">Tutte le filiere</option>${D.filiere.map(f=>`<option ${state.filtroFil===f?"selected":""}>${f}</option>`).join("")}</select><span class="pill">${l.length} risultati</span></div>
 <table><thead><tr><th>Sigla</th><th>Settore</th><th>Città</th><th>Presidente</th><th>Tipo</th><th>Filiera</th></tr></thead><tbody>${l.map(a=>`<tr class="r" data-s="${a.sigla}"><td><b>${a.sigla}</b></td><td>${a.settore}</td><td>${a.citta||"n.d."}</td><td>${a.presidente||"n.d."}</td><td>${tag(tipoNome[a.tipo])}</td><td class="pill">${a.filiera||"da assegnare"}</td></tr>`).join("")}</tbody></table>
 <h2>Soci aggregati</h2><p class="sub">${D.aggregati.join(" · ")}</p>`}
function vAdesioni(){return `<div class="top"><div><h1>Pratiche di adesione</h1><p class="sub">Il flusso dello Statuto (art. 3): domanda, Comitato di Presidenza, ratifica in Giunta. Oggi su carta e email; qui ogni pratica ha uno stato e i suoi allegati.</p></div></div>
 <div class="flow">${D.flusso.map(f=>`<div class="on">${f}</div>`).join("")}</div>
 <table><thead><tr><th>Richiedente</th><th>Tipo</th><th>Stato</th><th>Nota</th></tr></thead><tbody>${D.pratiche.map(p=>`<tr><td><b>${p.chi}</b></td><td>${p.tipo}</td><td>${tag(p.stato,p.stato==="Socio attivo"?"ok":"y")}</td><td class="pill">${p.nota} ${EX}</td></tr>`).join("")}</tbody></table>
 <p class="note">Nomi e date dai siti e dalle email FINCO; gli stati sono un esempio di come il flusso compare nel Hub.</p>
 <h2>Modulo di adesione digitale</h2><p class="sub">Gli stessi campi del modulo cartaceo, compilati online dal richiedente, con allegati e firma.</p>
 <div class="grid g3">${D.campiModulo.map(c=>`<div class="card"><p>${c}</p></div>`).join("")}</div>`}
function oppRow(k,nome,sub,extra){const s=state.inviate[k];return `<li><div><b>${nome}</b><br><span class="m">${sub}</span></div><div>${s?tag("inviata a 38 associazioni","ok")+`<span class="pill"> letture: si contano dall'app</span>`:`<button class="btn ghost" data-inv="${k}">Invia alle associazioni</button>`}${extra||""}</div></li>`}
function vOpportunita(){return `<div class="top"><div><h1>Opportunità</h1><p class="sub">Convenzioni, fiere, formazione: un solo elenco, inviato per filiera, con letture e attivazioni misurate.</p></div></div>
 <h2>Convenzioni in essere</h2><ul class="list">${D.convenzioni.map((c,i)=>oppRow("c"+i,c.nome,`${c.offerta} · oggi: ${c.attivazione}`)).join("")}</ul>
 <h2>Formazione: protocollo FINCO-IBM</h2><ul class="list">${D.ibm.map((x,i)=>oppRow("i"+i,x.nome,x.cosa)).join("")}</ul>
 <p class="note">Le azioni «Invia» sono simulate: nella demo nessun messaggio parte davvero.</p>`}
function vCalendario(){return `<div class="top"><div><h1>Fiere ed eventi</h1><p class="sub">Dalle newsletter FINCO 9 e 10/2026. Ogni evento si invia alle associazioni e raccoglie le adesioni delle imprese.</p></div></div>
 <table><thead><tr><th>Data</th><th>Evento</th><th>Luogo</th><th>Tipo</th><th></th></tr></thead><tbody>${D.eventi.map((e,i)=>`<tr><td><b>${e.data}</b></td><td>${e.nome}</td><td>${e.luogo}</td><td class="pill">${e.tipo}</td><td>${state.inviate["e"+i]?tag("inviato","ok"):`<button class="btn ghost" data-inv="e${i}">Invia</button>`}</td></tr>`).join("")}</tbody></table>`}
function vOrgani(){const o=D.organi;const p=l=>l.map(([n,r])=>`<li><b>${n}</b><span class="m">${r}</span></li>`).join("");
 return `<div class="top"><div><h1>Organi e staff</h1><p class="sub">Da fincoweb.org/organi-finco e comunicato del 6 maggio 2026.</p></div></div>
 <div class="grid g2"><div class="card"><h3>Presidenza</h3><ul class="list"><li><b>${o.presidente[0]}</b><span class="m">${o.presidente[1]}</span></li>${p(o.vicepresidenti)}</ul></div>
 <div class="card"><h3>Consiglieri incaricati</h3><ul class="list">${p(o.consiglieri)}</ul></div><div class="card"><h3>Direzione e uffici</h3><ul class="list">${p(o.direzione)}</ul></div>
 <div class="card"><h3>Filiere</h3><ul class="list">${D.filiere.map(f=>`<li><b>${f}</b><span class="m">${D.associazioni.filter(a=>a.filiera===f).map(a=>a.sigla).join(", ")||"soci da assegnare"}</span></li>`).join("")}</ul></div></div>`}
function vAssociazione(){const a=D.associazioni.find(x=>x.sigla==="ANNA");
 return `<div class="top"><div class="hdr"><div class="logo">ANNA</div><div><h1>ANNA</h1><p class="sub">${a.nome} · ${a.citta} · Presidente ${a.presidente}</p></div></div><div class="pill">Anteprima del livello Associazione (gradino 2)</div></div>
 <div class="kpis"><div class="kpi"><div class="num">65</div><span>imprese associate (circa, fincoweb.org)</span></div><div class="kpi"><div class="num">${D.annaTavoli.length}</div><span>tavoli di lavoro</span></div><div class="kpi"><div class="num">${D.convenzioni.length+D.eventi.length}</div><span>opportunità ricevute da FINCO</span></div></div>
 <div class="grid g2" style="margin-top:14px"><div class="card"><h3>Imprese associate</h3><ul class="list">${D.annaImprese.map(i=>`<li><b>${i.nome}</b><span class="m">${[i.citta,i.nota].filter(Boolean).join(" · ")}</span></li>`).join("")}</ul><p class="note">Elenco parziale, dai comunicati ANNA 2026: l'anagrafica completa la carica l'associazione.</p></div>
 <div class="card"><h3>Tavoli di lavoro</h3><p>${D.annaTavoli.map(t=>tag(t)).join(" ")}</p><h3 style="margin-top:16px">Comunicazioni alle imprese</h3><ul class="list"><li><span>Assemblea 2026, Udine: rinnovo cariche</span>${tag("inviata","ok")}</li><li><span>Workshop IBM «Ideiamo insieme», 11/11/2026</span>${tag("inviata","ok")}</li><li><span>SENCON Dakar: adesioni entro il 15/11</span>${tag("da inviare","y")}</li></ul><p class="note">${EX} stati di invio illustrativi.</p></div></div>`}
function vImpresa(){return `<div class="top"><div class="hdr"><div class="logo">DC</div><div><h1>Dal Col Srl</h1><p class="sub">Merano (BZ) · socia ANNA · federata FINCO</p></div></div><div class="pill">Anteprima del livello Impresa (gradino 3)</div></div>
 <div class="grid g2"><div class="card"><h3>Opportunità per me</h3><ul class="list">${[["Trenitalia 2026","convenzione FINCO"],["Big 5 Global, Dubai, 23-26 nov 2026","collettiva ICE/FINCO"],["UNI: norme a prezzo ridotto","convenzione FINCO"],["Impariamo insieme (IBM)","webinar, certificazione gratuita"]].map(([n,s],i)=>`<li><div><b>${n}</b><br><span class="m">${s}</span></div>${state.attivate[i]?tag("richiesta inviata","ok"):`<button class="btn" data-att="${i}">Attiva</button>`}</li>`).join("")}</ul><p class="note">Un clic: la richiesta arriva alla Segreteria con i dati dell'impresa già compilati. Azione simulata.</p></div>
 <div class="card"><h3>La mia associazione</h3><ul class="list"><li><span>Attestato di appartenenza FINCO</span>${tag("disponibile","ok")}</li><li><span>Statuto e regolamento</span>${tag("disponibile","ok")}</li><li><span>Newsletter FINCO 10/2026</span>${tag("letta","ok")}</li><li><span>Rinnovo biennale</span><span class="pill">data da anagrafica</span></li></ul>
 <h3 style="margin-top:16px">Ufficio digitale OMO</h3><p>Per chi lo vuole: Amministrazione, Sicurezza e subappalti, Cantiere, Commerciale. Si parte dalla formazione AI.</p><p class="note">Opzionale, mai obbligatorio: FINCO resta il canale, l'impresa sceglie.</p></div></div>`}
const VIEWS={"#federazione":vFederazione,"#anagrafica":vAnagrafica,"#adesioni":vAdesioni,"#opportunita":vOpportunita,"#calendario":vCalendario,"#organi":vOrgani,"#associazione":vAssociazione,"#impresa":vImpresa};
function render(){const h=VIEWS[location.hash]?location.hash:"#federazione";$("#main").innerHTML=VIEWS[h]();
 document.querySelectorAll("#main table").forEach(t=>{const w=document.createElement("div");w.className="tw";t.replaceWith(w);w.appendChild(t)});nav();window.scrollTo(0,0)}
document.addEventListener("click",e=>{const b=e.target.closest("[data-inv]");if(b){state.inviate[b.dataset.inv]=true;render();return}
 const a=e.target.closest("[data-att]");if(a){state.attivate[a.dataset.att]=true;render();return}
 const r=e.target.closest("tr.r");if(r){const x=D.associazioni.find(z=>z.sigla===r.dataset.s);$("#panel").innerHTML=`<button class="btn ghost x" id="px">Chiudi</button><h2 style="margin:0 0 6px">${x.sigla}</h2><p class="sub">${x.nome}</p><ul class="list"><li><span class="m">Settore</span><b>${x.settore}</b></li><li><span class="m">Città</span><b>${x.citta||"n.d."}</b></li><li><span class="m">Presidente</span><b>${x.presidente||"n.d."}</b></li><li><span class="m">Tipo</span><b>${tipoNome[x.tipo]}</b></li><li><span class="m">Filiera</span><b>${x.filiera||"da assegnare"}</b></li><li><span class="m">Imprese associate</span><b>da caricare</b></li><li><span class="m">Rinnovo biennale</span><b>da caricare</b></li></ul><p class="note">Il socio aggiorna la sua scheda da solo; la Segreteria vede le variazioni.</p>`;$("#panel").classList.add("open");return}
 if(e.target.id==="px"){$("#panel").classList.remove("open")} if(e.target.id==="menu"){$("#side").classList.toggle("open")}});
document.addEventListener("input",e=>{if(e.target.id==="q"){state.q=e.target.value;const t=e.target;render();const n=$("#q");n.focus();n.setSelectionRange(n.value.length,n.value.length)}});
document.addEventListener("change",e=>{if(e.target.id==="ft"){state.filtroTipo=e.target.value;render()}if(e.target.id==="ff"){state.filtroFil=e.target.value;render()}});
window.addEventListener("hashchange",render);render();
</script></body></html>
