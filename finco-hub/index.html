function render(){let h=VIEWS[location.hash]?location.hash:"#accesso";S.role=roleOf(h);const app=$("#app");
 if(!S.role){app.classList.add("solo");$("#side").style.display="none";$("#main").innerHTML=VIEWS[h]();$("#demo").style.display="none"}
 else{app.classList.remove("solo");$("#side").style.display="";$("#demo").style.display="";$("#main").innerHTML=VIEWS[h]();nav()}

function panel(kind,data){const P={invita:`<h2>Invita un'impresa</h2><p class="sub">L'impresa riceve un link personale via email o WhatsApp, conferma i suoi dati ed entra con il codice.</p><div class="form" style="margin-top:12px"><div><label>Impresa</label><input value="Gruber Logistics" readonly></div><div><label>Email del referente</label><input value="esempio@impresa.it" readonly></div><div><label>Canale</label><select><option>Email</option><option>WhatsApp</option></select></div></div><button class="btn" style="margin-top:12px" id="px">Invia invito (simulato)</button>`,

  sollecito:`<h2>Sollecito quota</h2><p class="sub">Email e notifica in app al referente dell'impresa, con il riferimento della fattura. Azione simulata.</p><button class="btn" style="margin-top:12px" id="px">Invia sollecito</button>`,
  salva:`<h2>Modifiche salvate</h2><p class="sub">La Segreteria FINCO e ANNA vedono la variazione nel registro, con data e autore. Azione simulata.</p><button class="btn" style="margin-top:12px" id="px">Ok</button>`};
 if(kind==="nuovacom"){S.nuovaCom=true;render();return}if(kind==="nuovaric"){S.nuovaRic=true;render();return}
 if(kind==="assoc"){const x=data;$("#panel").innerHTML=`<button class="btn ghost x" id="px">Chiudi</button><h2 style="margin:0 0 6px">${x.sigla}</h2><p class="sub">${x.nome}</p><ul class="list"><li><span class="m">Settore</span><b>${x.settore}</b></li><li><span class="m">Città</span><b>${x.citta||"n.d."}</b></li><li><span class="m">Presidente</span><b>${x.presidente||"n.d."}</b></li><li><span class="m">Tipo</span><b>${tipoNome[x.tipo]}</b></li><li><span class="m">Filiera</span><b>${x.filiera||"da assegnare"}</b></li><li><span class="m">Imprese nel registro</span><b>${allImprese().filter(i=>i.ass===x.sigla).length||"da caricare"}</b></li><li><span class="m">Contributo 2026</span><b>riservato</b></li><li><span class="m">Rinnovo biennale</span><b>da caricare</b></li></ul><p class="note">Il socio aggiorna la sua scheda da solo; la Segreteria vede le variazioni.</p>`}
 else if(kind==="impresa"){const x=data;$("#panel").innerHTML=`<button class="btn ghost x" id="px">Chiudi</button><h2 style="margin:0 0 6px">${x.nome}</h2><p class="sub">${x.ass} · ${x.citta||"n.d."} ${x.reale?"":EX}</p><ul class="list"><li><span class="m">Referente</span><b>${x.ref||"n.d."}</b></li><li><span class="m">Addetti</span><b>${x.addetti||"n.d."}</b></li><li><span class="m">Stato</span><b>${x.stato}</b></li><li><span class="m">Quota 2026</span><b>${x.quota||"n.d."}</b></li><li><span class="m">Rinnovo biennale</span><b>${x.rinnovo||"da caricare"}</b></li><li><span class="m">Accesso al Hub</span><b>${x.reale&&x.nome==="Dal Col Srl"?"attivo":"invito da inviare"}</b></li></ul><h3 style="margin-top:14px">Storico</h3><ul class="list"><li><span class="m">Documenti</span><b>attestato, statuto, ricevuta quota</b></li><li><span class="m">Richieste</span><b>${D.richieste.filter(r=>r.chi===x.nome).length}</b></li><li><span class="m">Eventi</span><b>da registro</b></li></ul>`}
 else{$("#panel").innerHTML=`<button class="btn ghost x" id="px">Chiudi</button>`+P[kind]}
 $("#panel").classList.add("open")}
document.addEventListener("click",e=>{const t=e.target;const g=a=>t.closest(`[${a}]`);let b;
 if(b=g("data-inv")){S.inviate[b.dataset.inv]=true;render();return}
 if(b=g("data-att")){S.attivate[b.dataset.att]=true;render();return}
 if(b=g("data-isc")){S.iscritte[b.dataset.isc]=true;render();return}
 if(b=g("data-ric")){S.richieste[b.dataset.ric]=b.dataset.st;S.nuovaRic=false;render();return}
 if(b=g("data-otp")){S.otp=+b.dataset.otp;render();return}
 if(b=g("data-reg")){S.reg=true;render();return}
 if(b=g("data-com")){S.nuovaCom=false;D.comunicazioni.unshift({titolo:"Convenzione UNI: nuove condizioni 2027",a:"tutte le associazioni",data:"oggi",inviate:38,lette:0,attivate:0});render();return}
 if(b=g("data-panel")){panel(b.dataset.panel);return}
 if(b=t.closest("tr.r")){if(b.dataset.s)panel("assoc",D.associazioni.find(z=>z.sigla===b.dataset.s));else panel("impresa",allImprese().find(z=>z.nome===b.dataset.i));return}
 if(t.id==="px"){$("#panel").classList.remove("open")} if(t.id==="menu"){$("#side").classList.toggle("open")}});
